spring:
  config:
    import:
      - optional:file:./.env[.properties]
      - optional:file:./backend/.env[.properties]
  application:
    name: little-home-school-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:postgresql://localhost:5432/little_home_school}}
    username: ${SPRING_DATASOURCE_USERNAME:${DATABASE_USERNAME:school_app}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DATABASE_PASSWORD:school_local_only}}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        default_batch_fetch_size: 50
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  jackson:
    default-property-inclusion: non_null
server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework
management:
  health:
    redis:
      enabled: ${REDIS_HEALTH_ENABLED:false}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: little-home-school-api
app:
  security:
    jwt-secret-base64: ${JWT_SECRET_BASE64}
    access-token-minutes: ${JWT_ACCESS_MINUTES:15}
    refresh-token-days: ${JWT_REFRESH_DAYS:30}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  bootstrap-admin:
    enabled: ${BOOTSTRAP_ADMIN_ENABLED:false}
    email: ${BOOTSTRAP_ADMIN_EMAIL:}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}
  test-accounts:
    enabled: ${TEST_ACCOUNTS_ENABLED:false}
    super-admin-password: ${TEST_SUPER_ADMIN_PASSWORD:}
    branch-admin-password: ${TEST_BRANCH_ADMIN_PASSWORD:}
    teacher-password: ${TEST_TEACHER_PASSWORD:}
    parent-password: ${TEST_PARENT_PASSWORD:}
springdoc:
  swagger-ui:
    path: /swagger-ui.html